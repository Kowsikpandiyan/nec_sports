version: '3.8'

services:
  mongodb:
    image: mongo:6.0-alpine
    container_name: minicap-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build: ./server
    container_name: minicap-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/minicap
      - JWT_ACCESS_SECRET=nec_sports_access_token_secret_string_123456_prod_change_me
      - JWT_REFRESH_SECRET=nec_sports_refresh_token_secret_string_987654_prod_change_me
      - CLIENT_URL=http://localhost:3000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=placeholder-smtp-user@gmail.com
      - SMTP_PASS=placeholder-smtp-password
      - SMTP_FROM=no-reply@collegesports.edu
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api/v1
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: minicap-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongodb_data:
    driver: local
  server_uploads:
    driver: local
